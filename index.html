<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101828" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 用 default 而不是 black-translucent。
         black-translucent 会让状态栏文字变白并浮在内容之上，而这个应用顶部是
         浅色（#f6f8fb）的，白字在上面基本看不见；default 给不透明状态栏 + 深色
         文字，任何主题下都读得清。
         配合下面的 viewport-fit=cover，还要靠 CSS 里的 safe-area-inset-top
         把内容顶下来，否则内容仍然会钻到状态栏底下。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-title" content="错题本" />
    <title>Exam Tracker</title>
    <!-- 这一组 link 是「装到桌面」能生效的前提。
         之前 public/manifest.webmanifest 和 sw.js 都写好了，却没有在页面里
         引用 manifest —— 浏览器根本不知道它的存在，于是 display:standalone、
         快捷方式、图标全部失效，手机上点开就是带地址栏的网页。
         所以先前的 PWA 只算「文件齐了」，实际是死的。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- iOS 不认 SVG 主屏幕图标，必须给 PNG，否则装到桌面是个空白方块 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
