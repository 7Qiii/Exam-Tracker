<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- theme-color 由下面那段内联脚本按当前主题改写，这里的初值只是脚本没跑起来时的兜底 -->
    <meta name="theme-color" content="#dfe7f0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 主题必须在首屏渲染前定下来。
         以前 data-theme 是等 Vue 挂载后才写的，于是「跟随系统 + 系统深色」会先
         闪一下浅色再翻成深色；而且在这之前 <html> 上根本没有 data-theme，
         CSS 里所有 [data-theme=...] 规则都落空。这里在解析阶段就按
         「已存偏好 → 系统」算出最终值直接写到 <html> 上，
         App.vue 挂载后会再执行一次同样的逻辑（幂等）。
         必须放在样式表之前，否则第一帧还是会用错主题。 -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var mode = localStorage.getItem("exam-tracker-theme-mode");
          if (mode !== "light" && mode !== "dark" && mode !== "system") mode = "system";
          var resolved =
            mode === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          root.dataset.theme = resolved;
          root.style.colorScheme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", resolved === "dark" ? "#0f141b" : "#dfe7f0");
        } catch (error) {
          // 隐私模式下访问 localStorage 会抛错：退回浅色，不影响渲染
          root.dataset.theme = "light";
        }
      })();
    </script>
    <!-- 用 default 而不是 black-translucent。
         black-translucent 会让状态栏文字变白并浮在内容之上，而这个应用顶部在浅色
         主题下是浅色的（#dfe7f0 起），白字在上面基本看不见；default 给不透明状态栏
         + 深色文字，任何主题下都读得清。
         配合下面的 viewport-fit=cover，还要靠 CSS 里的 safe-area-inset-top
         把内容顶下来，否则内容仍然会钻到状态栏底下。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-title" content="错题本" />
    <meta name="description" content="考研成绩追踪、错题记录与图片复盘工具：本地优先存储，支持多设备同步与 AI 错题解析。" />
    <title>Exam Tracker</title>
    <!-- 这一组 link 是「装到桌面」能生效的前提。
         之前 public/manifest.webmanifest 和 sw.js 都写好了，却没有在页面里
         引用 manifest —— 浏览器根本不知道它的存在，于是 display:standalone、
         快捷方式、图标全部失效，手机上点开就是带地址栏的网页。
         所以先前的 PWA 只算「文件齐了」，实际是死的。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- iOS 不认 SVG 主屏幕图标，必须给 PNG，否则装到桌面是个空白方块 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 启动图。没有这一组，从主屏幕点开会先闪一张白屏再出现内容 ——
         iOS 不像安卓能用 manifest 的 background_color 自动生成，必须每种机型
         的分辨率各给一张，靠 media 精确匹配（device-width/height 用 CSS 点）。
         内容是**一块纯色**，不放 logo 也不放文字 —— 这是照 Apple HIG 抄的：
         启动屏要和首屏「几乎一样」，首屏是纯色就只放那个纯色；放字标/logo
         反而多一次闪，而文字又没法本地化。底色就是 App 的 --bg，由
         scripts/gen-splash.mjs 直接从 design-system.css 读，不在这里手抄。
         每种机型两条：先浅色，再深色（深色那条多一个 prefers-color-scheme 条件）。
         **顺序不能反** —— 万一 iOS 不支持带配色条件的启动图，会回落到前一条
         浅色，而不是变成「一张都匹配不上」退回白闪。清单见 public/splash/screens.json。 -->
    <link rel="apple-touch-startup-image" href="/splash/light/640x1136.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/dark/640x1136.png" media="(prefers-color-scheme: dark) and (device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/light/750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/dark/750x1334.png" media="(prefers-color-scheme: dark) and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/light/1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/dark/1125x2436.png" media="(prefers-color-scheme: dark) and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/light/1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/dark/1170x2532.png" media="(prefers-color-scheme: dark) and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/light/1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/dark/1179x2556.png" media="(prefers-color-scheme: dark) and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/light/1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/dark/1206x2622.png" media="(prefers-color-scheme: dark) and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/light/828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/dark/828x1792.png" media="(prefers-color-scheme: dark) and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/splash/light/1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/dark/1242x2688.png" media="(prefers-color-scheme: dark) and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/light/1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/dark/1284x2778.png" media="(prefers-color-scheme: dark) and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/light/1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/dark/1290x2796.png" media="(prefers-color-scheme: dark) and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/light/1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/dark/1320x2868.png" media="(prefers-color-scheme: dark) and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
